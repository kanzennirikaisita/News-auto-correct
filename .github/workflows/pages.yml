name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger push workflows. Deploy after collection explicitly.
  workflow_run:
    workflows: ['Collect radar feed']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public assets only
        run: |
          mkdir -p _site
          cp index.html styles.css app.js domain.mjs sw.js manifest.webmanifest _site/
          cp -r icons data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
